# Episodic-return-sparsified MORLAX MOHopper (run vs jump).
# Each objective's per-step reward is withheld (0) until that objective's
# RUNNING episodic return crosses its threshold, then the true per-step reward
# flows. Below threshold every policy reports 0 for that objective -> a flat
# zero-return plateau that Pareto selection cannot rank. This is the naive
# "no algorithmic changes" baseline for the heterogeneous-sparsity sweep.
#
# `episodic_threshold.thresholds` holds literal per-objective thresholds (order
# matches `objectives`, i.e. [run, jump]); scripts/sparse_threshold_sweep.py
# overrides these directly per run. Set enabled=false (or all-zero thresholds)
# for a dense baseline. num_timesteps is 50M to match the reference point where
# the dense run/jump returns top out around 2500 / 2200.
name: morlax-hopper-sparse-run0
save_dir: /nfs/hpc/share/thakarr/SMORL/results/morlax_hopper_sparse_sweep
description: 'Episodic-return-sparsified MORLAX MOHopper (run vs jump); naive baseline sweep'
algorithm: morlax
env: MOHopper
backend: np # jnp or np. Always uses jnp for training
mo2so:
  enabled: false
  weighting: [0.5, 0.5]
env_config:
  ctrl_dt: 0.01
  sim_dt: 0.005
  action_scale: 3.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: false
  add_random_pitch: false
  reward:
    weights:
      run:        1.5
      jump:       12.0
      ctrl_cost: -0.0002
      alive:      1.0
      upright:    4.0
      done:       0
    sigmas:
      height:     0.01
      speed:      0.01
      energy:     0.1
      imitation:  0.03
    optimization:
      objectives:        [['run'], ['jump']]
      # No shared terms: each objective return is the pure task signal, so the
      # episodic-return threshold measures genuine run/jump achievement rather
      # than survival. Viability is handled by termination, not additive reward.
      shared_objectives: []
      labels:            ['Forward Distance', 'Jump Height']
    # Episodic-return sparsification. thresholds order matches `objectives`
    # (i.e. [run, jump]). Overridden by the sweep driver.
    episodic_threshold:
      enabled: true
      thresholds: [1250.0, 1100.0]
  termination:
    enabled: true
    base_height: 0.2
learning_params:
  base_ppo_params:
    action_repeat: 1
    batch_size: 32
    clipping_epsilon: 0.2
    deterministic_eval: true
    discounting: 0.99
    entropy_cost: 0.01
    episode_length: 500
    learning_rate: 0.000005
    max_grad_norm: 1.0
    normalize_observations: true
    num_envs: 1024
    num_evals: 15
    num_minibatches: 32
    num_timesteps: 50000000
    num_updates_per_batch: 4
    reward_scaling: 1.0
    seed: 0
    unroll_length: 30
  morlax_params:
    train_fn_params:
      alpha: 1.0
      k: 8
      sampling: sparse-heavytail
      warmup_frac: 0.0
    network_params:
      hypertype: dual
      hypersize: [128, 128]
      num_features: 16
      policy_hidden_layer_sizes: [64, 64]
      value_hidden_layer_sizes:  [64, 64]
    warmup_params:
      # Optional parameter warm-start (disabled for naive sparse sweeps).
      enabled: false
      policy_checkpoint: ''
