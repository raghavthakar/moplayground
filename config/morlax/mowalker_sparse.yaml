# Naive (no-migration) MORLAX MOWalker with episodic-return sparsity.
#
# Thresholds are overridden by the launcher. They are *not* percent-of-max;
# they are range-normalized from the dense calibration (60M, 3 seeds):
#
#   nadir  = [0, -100]     # run min ~0, energy min ~-100
#   ideal  = [2500, 1900]  # run max ~2500, energy max ~1900
#   T      = nadir + p * (ideal - nadir)
#
# Same numbers give an HV reference slightly below the nadir:
#   ref_point_max ≈ [-125, -200]   # nadir - 5% of range
# (not yet wired into live W&B; origin-ref HV is only mildly wrong here).
#
# Matches mohopper_sparse / mowalker_dense: shared_objectives [], 100M, same
# MORLAX hyperparameters. seed_sweep overrides thresholds + seed. num_evals=21
# -> archive/eval snapshot every ~5M.
name: morlax-walker-sparse
save_dir: /nfs/hpc/share/thakarr/SMORL/results/walker_sparse_cliff_100m
description: 'Sparse MORLAX MOWalker (run vs energy); naive baseline cliff'
algorithm: morlax
env: MOWalker
backend: np
mo2so:
  enabled: false
  weighting: [0.5, 0.5]
env_config:
  ctrl_dt: 0.01
  sim_dt: 0.005
  action_scale: 3.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: false
  add_random_pitch: false
  reward:
    weights:
      run:        1.0
      energy:     1.0
      alive:      1.0
      done:       0
    sigmas:
      height:     0.01
      speed:      0.01
      energy:     0.1
      imitation:  0.03
    optimization:
      objectives:        [['run'], ['energy']]
      shared_objectives: []
      labels:            ['Running Speed', 'Energy Efficiency']
    episodic_threshold:
      enabled: true
      thresholds: [100.0, -20.0]  # p=0.04 placeholder; launcher overrides
  termination:
    enabled: true
    base_height: 0.2
learning_params:
  base_ppo_params:
    action_repeat: 1
    batch_size: 32
    clipping_epsilon: 0.2
    deterministic_eval: true
    discounting: 0.99
    entropy_cost: 0.01
    episode_length: 500
    learning_rate: 0.000005
    max_grad_norm: 1.0
    normalize_observations: true
    num_envs: 1024
    num_evals: 21
    num_minibatches: 32
    num_timesteps: 100000000
    num_updates_per_batch: 4
    reward_scaling: 1.0
    seed: 0
    unroll_length: 30
  morlax_params:
    train_fn_params:
      alpha: 1.0
      k: 8
      sampling: sparse-heavytail
      warmup_frac: 0.0
    network_params:
      hypertype: dual
      hypersize: [128, 128]
      num_features: 16
      policy_hidden_layer_sizes: [64, 64]
      value_hidden_layer_sizes:  [64, 64]
