# Teacher-demo data source for BC transfer into MORLAX (sparse MOHopper, 50x50).
#
# distill_params below defines the frozen IntrinsicPPO/RND teachers and the fixed
# preference label each one anchors. scripts/collect_teacher_demos.py rolls these
# teachers and saves (obs, raw_action, w_label) to demo_buffer; that buffer seeds
# the BC-based transfer migration into the preference-conditioned hypernetwork.
#
# Validation (probe, 2026-08-27): offline BC on this buffer recovered the teachers
# at their anchors (run w=[1,0] ~710/160 vs 704/136; balanced w=[.5,.5] ~638/819
# vs 624/805), confirming behavioral transfer is representable in the hypernet.
# Pure offline BC was unstable / covariate-shift-limited -> the migration pairs it
# with online PPO. The env/PPO/network settings here match the MORLAX training run.
#
# Teachers (RND seed0 retention archive, thr=50x50):
#   member 4  -> w=[1, 0]   run specialist
#   member 9  -> w=[0, 1]   jump specialist
#   member 11 -> w=[0.5,0.5] balanced breakthrough
name: morlax-hopper-sparse-bc-run0
save_dir: /nfs/hpc/share/thakarr/SMORL/results/morlax_hopper_sparse_bc
description: 'Sparse MORLAX + offline BC from RND archive teachers (50x50 trap)'
algorithm: morlax
env: MOHopper
backend: np
mo2so:
  enabled: false
  weighting: [0.5, 0.5]
env_config:
  ctrl_dt: 0.01
  sim_dt: 0.005
  action_scale: 3.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: false
  add_random_pitch: false
  reward:
    weights:
      run:        1.5
      jump:       12.0
      ctrl_cost: -0.0002
      alive:      1.0
      upright:    4.0
      done:       0
    sigmas:
      height:     0.01
      speed:      0.01
      energy:     0.1
      imitation:  0.03
    optimization:
      objectives:        [['run'], ['jump']]
      shared_objectives: []
      labels:            ['Forward Distance', 'Jump Height']
    episodic_threshold:
      enabled: true
      thresholds: [50.0, 50.0]
  termination:
    enabled: true
    base_height: 0.2
learning_params:
  base_ppo_params:
    action_repeat: 1
    batch_size: 32
    clipping_epsilon: 0.2
    deterministic_eval: true
    discounting: 0.99
    entropy_cost: 0.01
    episode_length: 500
    learning_rate: 0.000005
    max_grad_norm: 1.0
    normalize_observations: true
    num_envs: 1024
    num_evals: 15
    num_minibatches: 32
    num_timesteps: 50000000
    num_updates_per_batch: 4
    reward_scaling: 1.0
    seed: 0
    unroll_length: 30
  morlax_params:
    train_fn_params:
      alpha: 1.0
      k: 8
      sampling: sparse-heavytail
      warmup_frac: 0.0
    network_params:
      hypertype: dual
      hypersize: [128, 128]
      num_features: 16
      policy_hidden_layer_sizes: [64, 64]
      value_hidden_layer_sizes:  [64, 64]
    distill_params:
      enabled: true
      demo_buffer: /nfs/hpc/share/thakarr/SMORL/data/mohopper_sparse_bc_demos.npz
      num_episodes: 64
      teachers:
        - name: run-balanced-m4
          checkpoint: /nfs/hpc/share/thakarr/SMORL/results/retention_archive/rnd/intrinsic-ppo-hopper-rnd-run0-thr=50x50-iscale=1-seed=0/000021565440
          preference: [1.0, 0.0]
        - name: jump-m9
          checkpoint: /nfs/hpc/share/thakarr/SMORL/results/retention_archive/rnd/intrinsic-ppo-hopper-rnd-run0-thr=50x50-iscale=1-seed=0/000039536640
          preference: [0.0, 1.0]
        - name: balanced-m11
          checkpoint: /nfs/hpc/share/thakarr/SMORL/results/retention_archive/rnd/intrinsic-ppo-hopper-rnd-run0-thr=50x50-iscale=1-seed=0/000046725120
          preference: [0.5, 0.5]
