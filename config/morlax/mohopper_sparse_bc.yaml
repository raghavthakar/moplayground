# Behavioral-cloning transfer validation on sparse MOHopper (50x50 trap).
#
# Experiment question: can frozen IntrinsicPPO teachers transfer *behavior*
# into a cold-started MORLAX hypernetwork (no parameter warm-start), and does
# an offline BC tether prevent the run-skill collapse seen after warm-start?
#
# Pipeline:
#   1. scripts/collect_teacher_demos.py rolls frozen archive teachers on the
#      gated train env and saves (obs, raw_action, w_label) to demo_buffer.
#   2. scripts.train runs standard sparse-heavytail MORLAX PPO with an auxiliary
#      BC loss: L = L_PPO + λ(t) · E[-log π_MORLAX(a_teacher|s, w_label)].
#      w_label is fixed per teacher (never sampled for BC).
#
# Teachers (RND seed0 retention archive, thr=50x50):
#   member 4  -> w=[1, 0]   run specialist
#   member 9  -> w=[0, 1]   jump specialist
#   member 11 -> w=[0.5,0.5] balanced breakthrough
#
# Success criterion vs morlax-warm-m11-thr50-seed0: forward eval stays above the
# 50 gate through the first ~10M steps while jump still densifies.
name: morlax-hopper-sparse-bc-run0
save_dir: /nfs/hpc/share/thakarr/SMORL/results/morlax_hopper_sparse_bc
description: 'Sparse MORLAX + offline BC from RND archive teachers (50x50 trap)'
algorithm: morlax
env: MOHopper
backend: np
mo2so:
  enabled: false
  weighting: [0.5, 0.5]
env_config:
  ctrl_dt: 0.01
  sim_dt: 0.005
  action_scale: 3.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: false
  add_random_pitch: false
  reward:
    weights:
      run:        1.5
      jump:       12.0
      ctrl_cost: -0.0002
      alive:      1.0
      upright:    4.0
      done:       0
    sigmas:
      height:     0.01
      speed:      0.01
      energy:     0.1
      imitation:  0.03
    optimization:
      objectives:        [['run'], ['jump']]
      shared_objectives: []
      labels:            ['Forward Distance', 'Jump Height']
    episodic_threshold:
      enabled: true
      thresholds: [50.0, 50.0]
  termination:
    enabled: true
    base_height: 0.2
learning_params:
  base_ppo_params:
    action_repeat: 1
    batch_size: 32
    clipping_epsilon: 0.2
    deterministic_eval: true
    discounting: 0.99
    entropy_cost: 0.01
    episode_length: 500
    learning_rate: 0.000005
    max_grad_norm: 1.0
    normalize_observations: true
    num_envs: 1024
    num_evals: 15
    num_minibatches: 32
    num_timesteps: 50000000
    num_updates_per_batch: 4
    reward_scaling: 1.0
    seed: 0
    unroll_length: 30
  morlax_params:
    train_fn_params:
      alpha: 1.0
      k: 8
      sampling: sparse-heavytail
      warmup_frac: 0.0
    network_params:
      hypertype: dual
      hypersize: [128, 128]
      num_features: 16
      policy_hidden_layer_sizes: [64, 64]
      value_hidden_layer_sizes:  [64, 64]
    warmup_params:
      enabled: false
      policy_checkpoint: ''
    distill_params:
      enabled: true
      demo_buffer: /nfs/hpc/share/thakarr/SMORL/data/mohopper_sparse_bc_demos.npz
      num_episodes: 64
      bc_batch_size: 256
      bc_coef: 1.0
      bc_coef_final: 0.1
      bc_decay_steps: 10000000
      teacher_network_params:
        policy_hidden_layer_sizes: [64, 64]
        value_hidden_layer_sizes: [256, 256]
      teachers:
        - name: run-balanced-m4
          checkpoint: /nfs/hpc/share/thakarr/SMORL/results/retention_archive/rnd/intrinsic-ppo-hopper-rnd-run0-thr=50x50-iscale=1-seed=0/000021565440
          preference: [1.0, 0.0]
        - name: jump-m9
          checkpoint: /nfs/hpc/share/thakarr/SMORL/results/retention_archive/rnd/intrinsic-ppo-hopper-rnd-run0-thr=50x50-iscale=1-seed=0/000039536640
          preference: [0.0, 1.0]
        - name: balanced-m11
          checkpoint: /nfs/hpc/share/thakarr/SMORL/results/retention_archive/rnd/intrinsic-ppo-hopper-rnd-run0-thr=50x50-iscale=1-seed=0/000046725120
          preference: [0.5, 0.5]
