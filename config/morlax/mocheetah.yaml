# Matched to MO-Playground paper / official wandb run:
#   njanwani-gatech/MO-Playground-Official/4303yymq
# Legacy schema mapped to current keys:
#   algorithm: ppo              -> morlax
#   ppo_params                  -> base_ppo_params
#   hypermorl_params            -> morlax_params.train_fn_params
#   hypernetwork_params         -> morlax_params.network_params
#     hypertype: ActorCritic    -> single  (ActorCriticHypernet)
#   network_params (policy/value sizes) -> morlax_params.network_params
#   warmup_params               -> morlax_params.warmup_params
name: morlax-cheetah-run0
save_dir: /nfs/hpc/share/thakarr/SMORL/results/morlax_cheetah
description: 'Paper-matched MORLAX MOCheetah baseline (run vs energy); wandb 4303yymq'
algorithm: morlax
env: MOCheetah
backend: np # jnp or np. Always uses jnp for training
mo2so:
  enabled: false
  weighting: [0.5, 0.5]
env_config:
  ctrl_dt: 0.01
  sim_dt: 0.01
  action_scale: 1.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: false
  add_random_pitch: false
  reward:
    weights:
      run:        1.0
      height:     10.0
      energy:     1.0
      alive:      1.0
      done:       0
    sigmas:
      height:     0.01
      speed:      0.01
      energy:     0.1
      imitation:  0.03
    optimization:
      objectives:        [['run'], ['energy']]
      shared_objectives: ['alive']
      labels:            ['Running Speed', 'Energy Efficiency']
  termination:
    enabled: true
    base_height: 0.2
learning_params:
  base_ppo_params:
    action_repeat: 1
    batch_size: 64
    clipping_epsilon: 0.1
    deterministic_eval: true
    discounting: 0.98
    entropy_cost: 0.01
    episode_length: 500
    learning_rate: 0.0005
    max_grad_norm: 1.0
    normalize_observations: true
    num_envs: 128
    num_evals: 15
    num_minibatches: 2
    num_timesteps: 50000000
    num_updates_per_batch: 4
    reward_scaling: 1.0
    unroll_length: 20
  morlax_params:
    train_fn_params:
      alpha: 1.0
      k: 8
      sampling: sparse-heavytail
      warmup_frac: 0.0
    network_params:
      # Paper: hypertype ActorCritic -> ActorCriticHypernet -> single (NOT dual)
      hypertype: single
      hypersize: [128, 128]
      num_features: 16
      policy_hidden_layer_sizes: [64, 64]
      value_hidden_layer_sizes: [64, 64]
    warmup_params:
      enabled: false
      policy: playground-results/SO-MOCheetah/a-good-policy/config.yaml
