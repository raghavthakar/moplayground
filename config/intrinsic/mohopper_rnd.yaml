# Stage-1 IntrinsicPPO: PPO trained only on RND novelty.
# Extrinsic (true) objective returns are measured at eval time on an *ungated*
# env; unlock rates compare those returns to `episodic_threshold.thresholds`
# (or unlock_thresholds under intrinsic_ppo_params.train_fn_params).
#
# Threshold gating on the train env is irrelevant for learning (reward is
# replaced by RND) but kept enabled so the dynamics/config match the sparse
# MORLAX failure runs.
name: intrinsic-ppo-hopper-rnd-run0
save_dir: /nfs/hpc/share/thakarr/SMORL/results/intrinsic_ppo_hopper
description: 'IntrinsicPPO + RND on MOHopper; extrinsic breakthrough eval'
algorithm: intrinsic_ppo
env: MOHopper
backend: np
mo2so:
  enabled: false
  weighting: [0.5, 0.5]
env_config:
  ctrl_dt: 0.01
  sim_dt: 0.005
  action_scale: 3.0
  history_length: 5
  ideal_base_height: 0.5
  ideal_base_vel: 0.5
  min_base_height: 0.3
  add_random_joint_state: false
  add_random_pitch: false
  reward:
    weights:
      run:        1.5
      jump:       12.0
      ctrl_cost: -0.0002
      alive:      1.0
      upright:    4.0
      done:       0
    sigmas:
      height:     0.01
      speed:      0.01
      energy:     0.1
      imitation:  0.03
    optimization:
      objectives:        [['run'], ['jump']]
      shared_objectives: ['alive', 'ctrl_cost']
      labels:            ['Forward Distance', 'Jump Height']
    # Used as unlock thresholds for extrinsic eval (and optional train gating).
    # Set these to a Hard point from your MORLAX sparse sweep.
    episodic_threshold:
      enabled: true
      thresholds: [100.0, 100.0]
  termination:
    enabled: true
    base_height: 0.2
learning_params:
  base_ppo_params:
    action_repeat: 1
    batch_size: 32
    clipping_epsilon: 0.2
    deterministic_eval: true
    discounting: 0.99
    entropy_cost: 0.01
    episode_length: 500
    learning_rate: 0.0003
    max_grad_norm: 1.0
    normalize_observations: true
    num_envs: 1024
    num_evals: 15
    num_minibatches: 32
    num_timesteps: 50000000
    num_updates_per_batch: 4
    reward_scaling: 1.0
    unroll_length: 30
  intrinsic_ppo_params:
    train_fn_params: {}
    network_params:
      policy_hidden_layer_sizes: [64, 64]
      value_hidden_layer_sizes: [256, 256]
    rnd_params:
      hidden_layer_sizes: [256, 256]
      output_size: 64
      learning_rate: 0.0001
