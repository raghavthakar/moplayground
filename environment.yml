# GPU training environment (Linux + CUDA 13).
# Edit `prefix` below to the directory where you want the env created, then:
#   conda env create -f environment.yml
#   conda activate /path/to/prefix   # same path as `prefix`
#   pip install -e .
#
# Requires a CUDA 13-capable NVIDIA driver. For CPU/Mac evaluation, use
# mac_environment.yml instead.
channels:
  - defaults
dependencies:
  - python=3.12.12
  - pip
  - pip:
      # --- Direct project dependencies (pyproject.toml) ---
      - numpy==2.3.5
      - "jax[cuda13]==0.9.0"
      - jaxlib==0.9.0
      - playground==0.0.5
      - pymoo==0.6.1.6
      - matplotlib==3.10.8
      - opencv-python==5.0.0.93
      - pandas==2.2.3
      - tqdm==4.67.1
      - mediapy==1.2.5
      - minimal-mjx==0.1.4
      # --- Runtime / logging used by moplayground ---
      - wandb==0.28.1
      - pyyaml==6.0.3
      - h5py==3.16.0
      # --- Pinned stack (playground / brax / mujoco) ---
      - absl-py==2.4.0
      - brax==0.14.0
      - chex==0.1.91
      - etils==1.13.0
      - flax==0.12.3
      - glfw==2.10.0
      - jaxopt==0.8.5
      - lxml==6.0.2
      - ml-collections==1.1.0
      - ml-dtypes==0.5.4
      - msgpack==1.1.2
      - mujoco==3.4.0
      - mujoco-mjx==3.4.0
      - opt-einsum==3.4.0
      - optax==0.2.6
      - orbax-checkpoint==0.11.32
      - orbax-export==0.0.8
      - pillow==12.1.0
      - protobuf==6.33.4
      - pyopengl==3.1.10
      - rich==14.3.1
      - scipy==1.17.0
      - tensorboardx==2.6.4
      - tensorstore==0.1.80
      - toolz==1.1.0
      - treescope==0.1.10
      - trimesh==4.11.1
      - typing-extensions==4.15.0
      - warp-lang==1.11.0
      # --- brax viewer / misc ---
      - flask==3.1.2
      - flask-cors==6.0.2
      - jinja2==3.1.6
      - requests==2.34.2
      - sentry-sdk==2.66.1
prefix: /home/raghav/Research/SMORL
